<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="styleP1.css"/>
</head>
<body>
    <div class="profile-card">
    <div class="image">
        <img src="shankar photo.jpg" alt="" class="profile-img">
    </div>
    <div class="text-data">
        <span class="name">Shankar Gouda</span>
        <span class="job">Student & Human</span>
    </div>
    <div class="media-buttons">
        <a href="#" style="background-color: #f10c8af6" class="link">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" style="background-color: #170f1f" class="link">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a href="#" style="background-color: #4267b2" class="link">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="#" style="background-color: #174092" class="link">
          <i class="fa-brands fa-linkedin"></i>
        </a>
    </div>
    <div class="buttons">
        <button class="button">Follow</button>
        <button class="button">Message</button>
    </div>
    <div class="anl">
        <div class="data">
            <i class="fa-regular fa-heart"></i>
            <span class="number">100k</span>
        </div>
        <div class="data">
          <i class="fa-regular fa-comment"></i>
            <span class="number">50k</span>
        </div>
        <div class="data">
            <i class="fa-solid fa-share"></i>
            <span class="number">25k</span>
        </div>
    </div>
    </div>
</body>
</html>
